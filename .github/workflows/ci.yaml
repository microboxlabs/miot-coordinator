# =============================================================================
# Build and Publish Docker Images
# =============================================================================
# This workflow builds and publishes Docker images to:
#   - GitHub Container Registry (GHCR) - Primary registry
#   - Docker Hub - Secondary mirror (releases only)
#
# Tagging Strategy:
#   - PRs:        ghcr.io/<org>/<image>:pr-<number>
#   - main/trunk: ghcr.io/<org>/<image>:latest + dockerhub/<image>:latest
#   - Tags:       ghcr.io/<org>/<image>:<version> + dockerhub/<image>:<version>
#   - All:        ghcr.io/<org>/<image>:sha-<short-sha>
#
# Required Secrets for Docker Hub:
#   - DOCKERHUB_USERNAME: Docker Hub username
#   - DOCKERHUB_TOKEN: Docker Hub access token (not password)
# =============================================================================

name: Build and Publish

run-name: ${{ github.actor }} is building ${{ github.repository }} 🚀

on:
  push:
    branches:
      - trunk
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - trunk
      - main

env:
  # Registry configuration
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  # Image name derived from repository (e.g., microboxlabs/ecm-coordinator)
  IMAGE_NAME: ${{ github.repository }}
  # Build configuration
  AMP_JS_CONSOLE_REPO: javascript-console-repo-0.7-SNAPSHOT.amp
  AMP_REPO_PATH: Alfresco/alfresco-docker-installer/master/generators/app/templates/addons/amps
  RAW_GITHUB_URL: https://raw.githubusercontent.com

jobs:
  build:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    # Required permissions for GHCR publishing
    permissions:
      contents: read
      packages: write
      # Required for attestations (optional, for supply chain security)
      attestations: write
      id-token: write

    outputs:
      # Export image tags for downstream jobs if needed
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      # =========================================================================
      # Checkout and Setup
      # =========================================================================
      - name: Checkout repository
        uses: actions/checkout@v6 

      - name: Install AMP packages
        run: |
          mkdir -p .extensions/amps
          curl -O '${{ env.RAW_GITHUB_URL }}/${{ env.AMP_REPO_PATH }}/${{ env.AMP_JS_CONSOLE_REPO }}'
          mv javascript-console-repo-0.7-SNAPSHOT.amp .extensions/amps

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          architecture: 'x64'
          java-version: '17'
          cache: maven

      - name: Run Maven package phase
        run: |
          mvn package -DskipTests=true
          ls -l target/extensions

      # =========================================================================
      # Docker Build Setup
      # =========================================================================
      - name: Set up QEMU
        # Required for multi-architecture builds (arm64 emulation on amd64 runners)
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        # Buildx is required for multi-platform builds and advanced caching
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # =========================================================================
      # Registry Authentication
      # =========================================================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        # Only login to Docker Hub for releases and main/trunk branch pushes
        # PRs don't need Docker Hub access
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================================================================
      # Image Metadata and Tags
      # =========================================================================
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ github.event_name != 'pull_request' && format('{0}/{1}', env.DOCKERHUB_REGISTRY, env.IMAGE_NAME) || '' }}
          # Tag generation rules:
          # - For PRs: pr-<number>
          # - For branches: latest (only for default branch)
          # - For tags: version number (v1.0.0 -> 1.0.0)
          # - Always: sha-<short-sha>
          tags: |
            # PR tags (GHCR only, handled by images filter above)
            type=ref,event=pr
            # Branch tags - 'latest' for default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # Semantic version tags from git tags
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            # SHA tag for traceability
            type=sha,prefix=sha-,format=short
          # OCI standard labels for image metadata
          labels: |
            org.opencontainers.image.title=ECM Coordinator
            org.opencontainers.image.description=Alfresco Content Services extension for ECM coordination
            org.opencontainers.image.vendor=MicroboxLabs
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme

      # =========================================================================
      # Build and Push
      # =========================================================================
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: target
          file: target/Dockerfile
          # Multi-architecture support
          platforms: linux/amd64,linux/arm64
          # Push to registry (always for GHCR, conditionally for Docker Hub via images list)
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Build cache configuration for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance attestations for supply chain security
          provenance: true
          sbom: true

      # =========================================================================
      # Post-build Information
      # =========================================================================
      - name: Output image information
        run: |
          echo "## Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Digest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build-push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Commands" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# From GitHub Container Registry (primary)" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# From Docker Hub (mirror)" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.DOCKERHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      # =========================================================================
      # Verify Image (optional security scan)
      # =========================================================================
      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: '${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # =============================================================================
  # Cleanup job for PR images (optional)
  # =============================================================================
  # Uncomment this job if you want to automatically delete PR images after merge
  # cleanup-pr-images:
  #   name: Cleanup PR Images
  #   runs-on: ubuntu-latest
