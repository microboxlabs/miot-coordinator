# =============================================================================
# Build and Publish - Docker Images & Maven Artifacts
# =============================================================================
# This workflow builds and publishes:
#
# Docker Images to:
#   - GitHub Container Registry (GHCR) - Primary registry
#   - Docker Hub - Secondary mirror (releases only)
#
# Maven Artifacts to:
#   - Maven Central (via Sonatype Central Portal) - Releases only
#
# Tagging Strategy:
#   - PRs:        ghcr.io/<org>/<image>:pr-<number> (no Maven publish)
#   - main/trunk: ghcr.io/<org>/<image>:latest (no Maven publish - snapshots not supported)
#   - Tags:       ghcr.io/<org>/<image>:<version> + Maven Central release
#
# Required Secrets:
#   Docker Hub:
#     - DOCKERHUB_USERNAME: Docker Hub username
#     - DOCKERHUB_TOKEN: Docker Hub access token
#   Maven Central (Sonatype):
#     - SONATYPE_USERNAME: Sonatype Central username (or token username)
#     - SONATYPE_PASSWORD: Sonatype Central password (or token password)
#     - GPG_PRIVATE_KEY: ASCII-armored GPG private key for signing
#     - GPG_PASSPHRASE: GPG key passphrase
# =============================================================================

name: Build and Publish

run-name: ${{ github.actor }} is building ${{ github.repository }} 🚀

on:
  push:
    branches:
      - trunk
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - trunk
      - main

env:
  # Registry configuration
  GHCR_REGISTRY: ghcr.io
  DOCKERHUB_REGISTRY: docker.io
  # Image name derived from repository (e.g., microboxlabs/miot-coordinator)
  IMAGE_NAME: ${{ github.repository }}
  # Build configuration
  AMP_JS_CONSOLE_REPO: javascript-console-repo-0.7-SNAPSHOT.amp
  AMP_REPO_PATH: Alfresco/alfresco-docker-installer/master/generators/app/templates/addons/amps
  RAW_GITHUB_URL: https://raw.githubusercontent.com
  # Java/Maven configuration
  JAVA_VERSION: '17'
  JAVA_DISTRIBUTION: 'temurin'

jobs:
  # ===========================================================================
  # Build Job - Compile, Test, and Package
  # ===========================================================================
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      is-release: ${{ steps.version.outputs.is-release }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install AMP packages
        run: |
          mkdir -p .extensions/amps
          curl -O '${{ env.RAW_GITHUB_URL }}/${{ env.AMP_REPO_PATH }}/${{ env.AMP_JS_CONSOLE_REPO }}'
          mv javascript-console-repo-0.7-SNAPSHOT.amp .extensions/amps

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Determine version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is-release=true" >> $GITHUB_OUTPUT
            echo "📦 Release version: $VERSION"
          else
            VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "is-release=false" >> $GITHUB_OUTPUT
            echo "📦 Snapshot version: $VERSION"
          fi

      - name: Build with Maven
        # Skip integration tests (IT) as they require a running Alfresco instance
        # Integration tests can be run locally with: mvn verify -DskipITs=false
        run: mvn -B verify -DskipITs --file pom.xml

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifacts
          path: |
            target/*.jar
            target/Dockerfile
            target/extensions/
            target/license/
            target/*.properties
            target/*.xml
          retention-days: 1

  # ===========================================================================
  # Publish Maven Artifacts to Maven Central
  # ===========================================================================
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: build
    # Only publish releases (tags starting with 'v')
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install AMP packages
        run: |
          mkdir -p .extensions/amps
          curl -O '${{ env.RAW_GITHUB_URL }}/${{ env.AMP_REPO_PATH }}/${{ env.AMP_JS_CONSOLE_REPO }}'
          mv javascript-console-repo-0.7-SNAPSHOT.amp .extensions/amps

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          # Configure server credentials for Sonatype Central
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Set release version
        run: |
          mvn -B versions:set -DnewVersion=${{ needs.build.outputs.version }} -DgenerateBackupPoms=false

      - name: Publish to Maven Central
        run: mvn -B deploy -Prelease -DskipTests
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Output Maven publish information
        run: |
          echo "## Maven Central Release Published 📦" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifact Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Group ID:** com.microboxlabs" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact ID:** miot-coordinator" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.build.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Maven Central Links" >> $GITHUB_STEP_SUMMARY
          echo "- [Maven Central](https://central.sonatype.com/artifact/com.microboxlabs/miot-coordinator/${{ needs.build.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "- [Javadoc](https://javadoc.io/doc/com.microboxlabs/miot-coordinator/${{ needs.build.outputs.version }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Usage" >> $GITHUB_STEP_SUMMARY
          echo '```xml' >> $GITHUB_STEP_SUMMARY
          echo "<dependency>" >> $GITHUB_STEP_SUMMARY
          echo "  <groupId>com.microboxlabs</groupId>" >> $GITHUB_STEP_SUMMARY
          echo "  <artifactId>miot-coordinator</artifactId>" >> $GITHUB_STEP_SUMMARY
          echo "  <version>${{ needs.build.outputs.version }}</version>" >> $GITHUB_STEP_SUMMARY
          echo "</dependency>" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Publish Docker Images
  # ===========================================================================
  publish-docker:
    name: Publish Docker Images
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    outputs:
      image-tags: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build-push.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-artifacts
          path: target

      - name: Verify artifacts
        run: |
          echo "Downloaded artifacts:"
          ls -la target/
          ls -la target/extensions/ || true

      # =========================================================================
      # Docker Build Setup
      # =========================================================================
      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      # =========================================================================
      # Registry Authentication
      # =========================================================================
      - name: Login to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ${{ env.DOCKERHUB_REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # =========================================================================
      # Image Metadata and Tags
      # =========================================================================
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: |
            ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ github.event_name != 'pull_request' && format('{0}/{1}', env.DOCKERHUB_REGISTRY, env.IMAGE_NAME) || '' }}
          tags: |
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=MIOT Coordinator
            org.opencontainers.image.description=Alfresco Content Services extension for ModularIoT coordination
            org.opencontainers.image.vendor=MicroboxLabs
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}#readme

      # =========================================================================
      # Build and Push
      # =========================================================================
      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: target
          file: target/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # =========================================================================
      # Post-build Information
      # =========================================================================
      - name: Output image information
        run: |
          echo "## Docker Image Published 🐳" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Tags" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image Digest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.build-push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pull Commands" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "# From GitHub Container Registry (primary)" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "# From Docker Hub (mirror)" >> $GITHUB_STEP_SUMMARY
            echo "docker pull ${{ env.DOCKERHUB_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA::7}" >> $GITHUB_STEP_SUMMARY
          fi
          echo '```' >> $GITHUB_STEP_SUMMARY

      # =========================================================================
      # Security Scan
      # =========================================================================
      - name: Run Trivy vulnerability scanner
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@6c175e9c4083a92bbca2f9724c8a5e33bc2d97a5 # v0.30.0
        with:
          image-ref: '${{ env.GHCR_REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-results.sarif'
        continue-on-error: true

      - name: Upload Trivy scan results to GitHub Security tab
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true
